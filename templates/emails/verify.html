{% extends "emails/base.html" %}
{% block body %}
  <h1>Verify your email</h1>
  <p>Hello {{ user.get_full_name }},</p>

  <p>Thanks for creating an account. Click the button below to confirm your email address and activate your account.</p>

  <p style="text-align:center; margin:22px 0;">
    <a href="{{ url }}" class="button btn-primary" target="_blank" rel="noopener">Verify Email</a>
  </p>

  <p>Need help? Contact <a href="mailto:{{ support_email }}">{{ support_email }}</a>.</p>
{% endblock %}
