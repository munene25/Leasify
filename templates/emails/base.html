<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="x-apple-disable-message-reformatting" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ subject }}</title>
    <style>
        body,
        table,
        td,
        a {
            -webkit-text-size-adjust: 100%;
            -ms-text-size-adjust: 100%;
        }

        table {
            border-collapse: collapse !important;
        }

        img {
            border: 0;
            outline: none;
            text-decoration: none;
            -ms-interpolation-mode: bicubic;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #f3f4f6;
            font-family: 'Helvetica', Arial, sans-serif;
            color: #111827;
        }

        .email-wrapper {
            width: 100%;
            padding: 20px 0;
        }

        .email-content {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 8px;
            overflow: hidden;
        }

        .email-header {
            padding: 20px;
            text-align: center;
            background: #081636;
            color: #fff;
        }

        .brand {
            font-weight: 700;
            font-size: 20px;
            letter-spacing: 0.3px;
        }

        .email-body {
            padding: 28px;
        }

        h1 {
            margin: 0 0 12px;
            font-size: 20px;
            color: #0f172a;
        }

        p {
            margin: 0 0 12px;
            line-height: 1.45;
            color: #374151;
        }

        .button {
            display: inline-block;
            padding: 12px 20px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }

        .btn-primary {
            background: #379ab8;
            margin: 1rem auto;
            color: #ffffff;
        }

        .email-footer {
            padding: 20px;
            font-size: 13px;
            color: #6b7280;
            text-align: center;
        }

        .small {
            font-size: 12px;
            color: #9ca3af;
        }

        /* Make button full width on tiny screens */
        @media screen and (max-width:420px) {
            .button {
                display: block;
                width: 80%;
                text-align: center;
            }
        }
    </style>
</head>

<body>
    <!-- preheader (hidden preview text shown in inbox) -->
    <div style="display:none; max-height:0; overflow:hidden;">
        {{ preheader|default:"" }}
    </div>

    <table class="email-wrapper" width="100%" cellpadding="0" cellspacing="0">
        <tr>
            <td text-align="center">
                <table class="email-content" width="100%" cellpadding="0" cellspacing="0">
                    <tr>
                        <td class="email-header">
                            <div class="brand">{{ app_name }}</div>
                        </td>
                    </tr>

                    <tr>
                        <td class="email-body">
                            {% block body %}{% endblock %}
                        </td>
                    </tr>

                    <tr>
                        <td class="email-footer">
                            <div>Need help? Reply to this email or
                                <a href="mailto:{{ support_email }}">contact us</a>
                            </div>
                            <div class="small" style="margin-top:8px;">
                                {{ company_name }} — {{ company_address }}<br />
                                If you no longer wish to receive these emails you may <a
                                    href="{{ unsubscribe_url }}">unsubscribe</a>.
                            </div>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>

</html>
