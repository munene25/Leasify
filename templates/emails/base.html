<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="x-apple-disable-message-reformatting" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ subject }}</title>
  <style>
    body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse !important; }
    body { margin: 0; padding: 0; background-color: #f3f4f6; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; color: #111827; }
    a { color: #000; font-weight: 600; text-decoration: none; }
    p { margin: 0 0 12px; line-height: 1.6; color: #444; }
    h1 { margin: 0 0 20px; font-size: 26px; font-weight: 700; color: #000; letter-spacing: -0.5px; }
    .small { font-size: 11px; color: #bbb; }
    @media screen and (max-width: 420px) {
      .email-content { border-radius: 0 !important; }
    }
  </style>
</head>
<body>
  <div style="display:none; font-family: 'Inter', Arial, sans-serif; max-height:0; overflow:hidden;">{{ preheader|default:"" }}</div>

  <table width="100%" cellpadding="0" cellspacing="0" style="padding: 32px 16px; background: #f3f4f6;">
    <tr><td align="center">
      <table width="580" cellpadding="0" cellspacing="0" class="email-content" style="max-width: 580px; border-radius: 8px; overflow: hidden;">

        <!-- header -->
        <tr><td style="background: #000; padding: 24px 32px;">
          <table width="100%" cellpadding="0" cellspacing="0">
            <tr>
              <td style="color: #fff; font-size: 22px; font-weight: 700; letter-spacing: -0.5px;">{{ app_name }}</td>
              <td style="text-align: right; color: #888; font-size: 12px;">Property Management</td>
            </tr>
          </table>
        </td></tr>

        <!-- body -->
        <tr><td style="background: #fff; padding: 40px 32px;">
          {% block body %}{% endblock %}
        </td></tr>

        <!-- footer -->
        <tr><td style="background: #fafafa; border-top: 1px solid #e5e5e5; padding: 20px 32px; text-align: center;">
          <p style="font-size: 12px; color: #888; margin: 0;">
            Need help? Reply to this email or <a href="mailto:{{ support_email }}">contact us</a>
          </p>
          <p class="small" style="margin-top: 8px;">
            {{ company_name }} — {{ company_address }}<br>
            <a href="{{ unsubscribe_url }}" style="color: #bbb;">Unsubscribe</a>
          </p>
        </td></tr>

      </table>
    </td></tr>
  </table>
</body>
</html>
